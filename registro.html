<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro fantasma | Alcancía familiar</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#462238;background:#fff0f6}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:530px;margin:35px auto}.card{background:white;border-radius:22px;padding:26px;box-shadow:0 12px 35px #8d34601c}h1{text-align:center;margin:0;color:#ae286b}p.sub{text-align:center;color:#93657c}label{display:block;margin:15px 0 5px;font-weight:650}input{width:100%;padding:12px;border:1px solid #e8c7d8;border-radius:10px;font:inherit}button{border:0;border-radius:11px;background:#c12b79;color:white;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:15px}button:disabled{opacity:.5;cursor:wait}.photo{width:95px;height:95px;object-fit:cover;border-radius:50%;display:block;margin:15px auto;background:#fbe3ed}.hidden{display:none}.status{margin-top:15px;white-space:pre-wrap;color:#8e2d5b}.item{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #f5e1eb}.item img{width:48px;height:48px;object-fit:cover;border-radius:50%}.note{font-size:12px;color:#93657c;line-height:1.5}hr{border:0;border-top:1px solid #f2d9e5;margin:24px 0}
</style>
</head>
<body><main class="wrap"><section class="card"><h1>👻 Registro fantasma</h1><p class="sub">🐷 Alcancía familiar</p>
<div id="loginPanel"><h2>Acceso de administradora</h2><label for="email">Correo de Firebase Authentication</label><input id="email" type="email" autocomplete="username"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Entrar</button></div>
<div id="registerPanel" class="hidden"><p id="signedIn"></p><button id="logoutBtn" type="button">Cerrar sesión</button><hr><form id="form"><label for="name">Nombre</label><input id="name" required maxlength="35" placeholder="Ej. Mamá"><label for="photo">Fotografía</label><input id="photo" type="file" accept="image/*" required><img id="preview" class="photo" alt="Vista previa de fotografía"><label for="pin">PIN (4 números)</label><input id="pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="4" pattern="[0-9]{4}" required><label for="confirm">Confirmar PIN</label><input id="confirm" type="password" inputmode="numeric" autocomplete="new-password" maxlength="4" pattern="[0-9]{4}" required><button id="saveBtn" type="submit">Guardar perfil en Firebase</button></form><hr><h2>Perfiles registrados <span id="count"></span></h2><div id="profiles"></div></div>
<p class="status" id="status" role="status"></p><p class="note">Solo para la administradora. Los PIN se envían a una Cloud Function protegida; nunca se guardan en texto plano en el navegador ni en Firestore.</p></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFunctions,httpsCallable} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js';
import {getFirestore,collection,query,orderBy,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyC1mlwNeaHfRPfJpWbw5t4_Gs9GQP0oSuU',authDomain:'personalsariss.firebaseapp.com',databaseURL:'https://personalsariss-default-rtdb.firebaseio.com',projectId:'personalsariss',storageBucket:'personalsariss.firebasestorage.app',messagingSenderId:'599186049637',appId:'1:599186049637:web:143a44ff18ff3f918cd48c'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),functions=getFunctions(app,'us-central1');
const $=id=>document.getElementById(id);let unsub=null;
const msg=t=>$('status').textContent=t;
$('loginBtn').onclick=async()=>{try{msg('Entrando…');await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);msg('');}catch(e){msg('No se pudo iniciar sesión: '+e.message)}};
$('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{if(unsub){unsub();unsub=null}$('loginPanel').classList.toggle('hidden',!!user);$('registerPanel').classList.toggle('hidden',!user);if(!user)return;$('signedIn').textContent='Sesión: '+user.email;unsub=onSnapshot(query(collection(db,'profiles'),orderBy('createdAt','asc')),snap=>{$('count').textContent=`(${snap.size}/4)`;$('profiles').replaceChildren();snap.forEach(doc=>{const p=doc.data(),item=document.createElement('div'),img=document.createElement('img'),name=document.createElement('strong');item.className='item';img.src=p.photoUrl||'';img.alt='Foto del perfil';name.textContent=p.name||'Sin nombre';item.append(img,name);$('profiles').append(item)})},e=>msg('No se pudieron leer perfiles: '+e.message))});
$('photo').onchange=()=>{const file=$('photo').files[0];if(file){const url=URL.createObjectURL(file);$('preview').src=url;$('preview').onload=()=>URL.revokeObjectURL(url)}};
$('form').onsubmit=async e=>{e.preventDefault();const name=$('name').value.trim(),pin=$('pin').value,confirm=$('confirm').value,file=$('photo').files[0];if(!name||!/^[0-9]{4}$/.test(pin)||pin!==confirm||!file){msg('Revisa el nombre, la foto y que los dos PIN coincidan (4 dígitos).');return}if(!file.type.startsWith('image/')||file.size>2*1024*1024){msg('Elige una imagen de máximo 2 MB.');return}const btn=$('saveBtn');btn.disabled=true;msg('Guardando perfil…');try{const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});await httpsCallable(functions,'createFamilyProfile')({name,pin,photoDataUrl:dataUrl});$('form').reset();$('preview').removeAttribute('src');msg('¡Perfil registrado correctamente! 💗')}catch(err){msg('No se pudo registrar: '+(err.message||err))}finally{btn.disabled=false}};
</script></body></html>
